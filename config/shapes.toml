# Shape legend: the single source of truth for query shapes.
# Selection weight per shape: W = (alpha * F + beta * I) / 3, computed when the file is loaded.
# W adds F and I rather than multiplying them (F x I, 'expected failures users would see') on purpose: the suite
# is for diagnosis (exposing weaknesses with a tiny budget), not for estimating the failure rate users would see.
# Adding lets rare but hard shapes keep their weight, and alpha/beta work as a dial between real use and stress.
#   F = how often analysts ask for this shape, 1-3. Every value is an author estimate: there are no query logs.
#       Each F_basis gives the shape's share of BIRD Mini-Dev questions as a cross-check only (a benchmark, not
#       real usage). Grounding F needs real usage data, e.g. a short poll of analysts.
#   I = how much it tests a Text-to-SQL system, 1-3. Starting values are calibrated from BIRD Mini-Dev's human
#       difficulty labels (calibration/bird_i.py; results in calibration/bird_i_results.json): stretched to 1-3 over
#       the shapes with at least 20 BIRD examples. Shapes with fewer keep the hand-set value. See each I_basis.
#       Measured values from real Text-to-SQL systems should replace these later.
# The coverage judge uses the definitions only and counts every shape equally.

alpha = 0.4
beta = 0.6
repeat_penalty = 0.5   # each repeat of a shape is worth this fraction of the previous one

[[shape]]
id = "lookup"
name = "Simple lookup"
description = "Retrieves facts about specific records from one table, with no aggregate."
triggers = ["what is", "which", "list", "show"]
example = "What is the account balance and phone number of Supplier#000000042?"
F = 3
F_basis = "author estimate; BIRD Mini-Dev share 36% of questions"
I = 1.0
I_basis = "BIRD: fitted difficulty 1.65 (n=180), the lowest of the well-measured shapes, so 1.0"
reason = "Asked daily, but nearly every system handles it, so it shows little."

[[shape]]
id = "aggregation"
name = "Aggregation"
description = "Computes a total, count, average, minimum or maximum, overall or per group."
triggers = ["total", "how many", "average", "number of", "per", "by"]
example = "What is the total order value per market segment?"
F = 3
F_basis = "author estimate; BIRD Mini-Dev share 48% of questions"
I = 1.7
I_basis = "BIRD: fitted difficulty 1.80 (n=241)"
reason = "Core reporting ask. Errors come from the grouping level and how measures are defined."

[[shape]]
id = "multi_join"
name = "Join (3+ tables)"
description = "Needs data from three or more tables. Derived by code from the tables the question links and the join path between them."
triggers = []
example = "What is the total revenue per region?"
F = 2
F_basis = "author estimate; BIRD Mini-Dev share 20% of questions"
I = 2.8
I_basis = "BIRD: fitted difficulty 2.05 (n=100)"
reason = "Choosing the join path is a top failure point, worse when no keys are declared."
derived = true

[[shape]]
id = "ranking"
name = "Ranking / top-K"
description = "Asks for the highest or lowest N items, overall or within each group."
triggers = ["top", "highest", "lowest", "most", "least", "best", "largest"]
example = "Who are the 10 customers with the highest total order value?"
F = 3
F_basis = "author estimate; BIRD Mini-Dev share 22% of questions"
I = 1.3
I_basis = "BIRD: fitted difficulty 1.72 (n=110), barely above lookup; most BIRD rankings are single superlatives"
reason = "Very common ask. Top-K within each group and ties are the hard parts."

[[shape]]
id = "time_trend"
name = "Time trend / period comparison"
description = "Groups by time periods (month, quarter, year) or compares periods. A date used only as a filter does not count."
triggers = ["per month", "each quarter", "by year", "over time", "trend", "year over year", "compared with"]
example = "How did total order value change month by month in 1997?"
F = 2
F_basis = "author estimate; BIRD Mini-Dev share 2% of questions (BIRD's databases aren't business reporting, where period trends are common)"
I = 3
I_basis = "hand-set: BIRD has only 11 examples (fitted 1.83, 95% CI 1.35-2.28), too few to move it"
reason = "Date bucketing, period-over-period and relative dates are frequent errors."

[[shape]]
id = "ratio"
name = "Ratio / share of total"
description = "Computes a share, percentage, proportion or rate (part divided by a whole)."
triggers = ["share", "percentage", "proportion", "fraction", "rate", "ratio"]
example = "What share of total order value comes from the BUILDING segment?"
F = 2
F_basis = "author estimate; BIRD Mini-Dev share 16% of questions"
I = 3.0
I_basis = "BIRD: fitted difficulty 2.09 (n=79), the highest of the well-measured shapes, so 3.0"
reason = "Needs two levels of aggregation. The denominator is often wrong."

[[shape]]
id = "vs_aggregate"
name = "Comparison against an aggregate"
description = "Compares records with an aggregate of a group (above or below average, more than the median)."
triggers = ["above average", "below average", "more than the average", "higher than typical"]
example = "Which suppliers have an account balance above the average for their nation?"
F = 1
F_basis = "author estimate; BIRD Mini-Dev share 1% of questions"
I = 3
I_basis = "hand-set: BIRD has only 6 examples (fitted 2.57), which points the same way"
reason = "Less common phrasing, and it needs a nested computation."

[[shape]]
id = "anti_join"
name = "Anti-join"
description = "Asks for records that have no matching record elsewhere."
triggers = ["never", "without", "no orders", "not ... any", "none"]
example = "Which customers have never placed an order?"
F = 1
F_basis = "author estimate; BIRD Mini-Dev share 0.4% of questions"
I = 3
I_basis = "hand-set: BIRD has only 2 examples (fitted 2.42)"
reason = "Rare phrasing, and a classic trap for systems (NOT IN with NULLs)."
