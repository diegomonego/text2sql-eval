[project]
name = "t2s-eval"
version = "0.1.0"
description = "Question generation and LLM judges for evaluating Text-to-SQL systems"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.1",
    "pydantic>=2.7",
    "pypdf>=5",
]

[project.scripts]
t2s = "t2s_eval.cli:main"

[dependency-groups]
calibration = [
    "numpy>=2.5.5",
    "sqlglot>=30.35.0",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
